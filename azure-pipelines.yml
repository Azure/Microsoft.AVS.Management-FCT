# # Midnight scheduled build (uncomment to enable!)
# schedules:
#     - cron: '0 0 * * *'
#       displayName: Daily midnight build
#       branches:
#         include:
#         - main

# This pipeline is triggered when changes are made to the 'main' branch.
trigger:
    - main

# Pipeline parameters — override these for manual runs to target a different SDDC or package version.
parameters:
    - name: subscriptionName
      displayName: Azure Subscription (service connection name)
      type: string
      default: FCT Pipeline
    - name: resourceGroupName
      displayName: Resource Group Name
      type: string
      default: AVS-Management-FCT
    - name: privateCloudName
      displayName: Private Cloud Name
      type: string
      default: AVS-Management-FCT
    - name: location
      displayName: Azure Region
      type: string
      default: canadacentral
    - name: identityPackageVersion
      displayName: Identity Package Version (e.g. "1.*" or "1.1.526")
      type: string
      default: "1.*"
    - name: isFirstRun
      displayName: First Run (provisions ADDS)
      type: boolean
      default: false

# This pipeline will run on an Ubuntu virtual machine.
pool:
    vmImage: ubuntu-latest

# Define the variables that will be used in the pipeline. The password and the username must be defined in the pipeline secret variables!
variables:
    resourceGroupName: ${{ parameters.resourceGroupName }}
    privateCloudName: ${{ parameters.privateCloudName }}
    location: ${{ parameters.location }}
    subscriptionName: ${{ parameters.subscriptionName }}
    identityPackageVersion: ${{ parameters.identityPackageVersion }}
    baseDNGroups: CN=Users,DC=contoso,DC=com # Your Base DN Groups
    baseDNUsers: CN=Users,DC=contoso,DC=com # Your Base DN Users
    domainName: contoso.com # FQDN of Your Domain
    domainNetBIOSName: contoso # Your BIOS Domain Name
    primaryURL: ldap://VM.contoso.com:389 # Your Primary URL
    secondaryURL: ldaps://VM.contoso.com:636 # Your Secondary (LDAPS) URL
    isFirstRun: ${{ parameters.isFirstRun }}
    system.debug: true # Set to 'true' to enable diagnostic tracing

# Define the steps that will be executed in the pipeline.
steps:
    - task: UseDotNet@2
      displayName: Install .NET 8 SDK
      inputs:
          packageType: sdk
          version: '8.x'

    - task: AzureCLI@2
      displayName: ARM Deployment
      inputs:
          azureSubscription: $(subscriptionName)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
              az deployment group create \
                  --resource-group $(resourceGroupName) \
                  --template-file main.bicep \
                  --parameters location=$(location) username=$(LDAPusername) password=$(LDAPpassword) domain=$(domainName) private_cloud_name=$(privateCloudName)

    # Initial setup - will only run if the isFirstRun variable is set to true
    - task: AzureCLI@2
      displayName: Update DNS Service # please do not run this step twice as it will result in error
      condition: eq(variables.isFirstRun, true)
      inputs:
          azureSubscription: $(subscriptionName)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
              az vmware workload-network dns-service update --resource-group $(resourceGroupName) --private-cloud $(privateCloudName) --dns-service dns-forwarder --fqdn-zones $(domainName)
    - task: AzureCLI@2
      displayName: Install ADDS
      condition: eq(variables.isFirstRun, true)
      inputs:
          azureSubscription: $(subscriptionName)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
              sleep 60s
              az vm run-command invoke -g $(resourceGroupName) -n VM --command-id RunPowerShellScript --scripts @adds_install.ps1 --parameters "DomainName=$(domainName)" "DomainNetBIOSName=$(domainNetBIOSName)" "Username=$(LDAPusername)" "Password=$(LDAPpassword)" --verbose
    - task: AzureCLI@2
      displayName: Restart VM
      condition: eq(variables.isFirstRun, true)
      inputs:
          azureSubscription: $(subscriptionName)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
              az vm run-command invoke -g $(resourceGroupName) -n VM --command-id RunPowerShellScript --scripts "Restart-Computer -Force" --verbose
    - task: AzureCLI@2
      displayName: Configure ADDS
      condition: eq(variables.isFirstRun, true)
      inputs:
          azureSubscription: $(subscriptionName)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
              sleep 60s
              az vm run-command invoke -g $(resourceGroupName) -n VM --command-id RunPowerShellScript --scripts @adds_install.ps1 --parameters "DomainName=$(domainName)" "DomainNetBIOSName=$(domainNetBIOSName)" "Username=$(LDAPusername)" "Password=$(LDAPpassword)" --verbose
    - task: AzureCLI@2
      displayName: Setup LDAPS Certificate
      condition: eq(variables.isFirstRun, true)
      inputs:
          azureSubscription: $(subscriptionName)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
              az vm run-command invoke -g $(resourceGroupName) -n VM --command-id RunPowerShellScript --scripts @ldaps_setup.ps1 --parameters "DomainName=$(domainName)" --verbose

    # Upload LDAPS certificate to blob storage and generate SAS URL
    - task: AzureCLI@2
      displayName: Upload LDAPS Certificate
      inputs:
          azureSubscription: $(subscriptionName)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
              storageAccountName=$(az storage account list -g $(resourceGroupName) --query "[0].name" -o tsv)

              az vm run-command invoke -g $(resourceGroupName) -n VM --command-id RunPowerShellScript \
                  --scripts "Get-Content -Path C:\ldaps_cert.cer -Raw" \
                  --query "value[0].message" -o tsv > cert_output.txt

              grep -v "Enable succeeded" cert_output.txt | sed '/^\[stdout\]/d; /^\[stderr\]/d; /^$/d' > ldaps_cert.cer

              az storage blob upload \
                  --account-name "$storageAccountName" \
                  --container-name certificates \
                  --name ldaps_cert.cer \
                  --file ldaps_cert.cer \
                  --auth-mode login \
                  --overwrite

              expiry=$(date -u -d "+1 hour" '+%Y-%m-%dT%H:%MZ')
              accountKey=$(az storage account keys list --account-name "$storageAccountName" -g $(resourceGroupName) --query "[0].value" -o tsv)

              sasUrl=$(az storage blob generate-sas \
                  --account-name "$storageAccountName" \
                  --account-key "$accountKey" \
                  --container-name certificates \
                  --name ldaps_cert.cer \
                  --permissions r \
                  --expiry "$expiry" \
                  --full-uri \
                  -o tsv)

              echo "##vso[task.setvariable variable=SSLCERTIFICATESAS]$sasUrl"

    # Use the Azure CLI to set variables that will be used in the C# code.
    - task: AzureCLI@2
      displayName: Set Variables
      inputs:
          azureSubscription: $(subscriptionName)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
              subscriptionId=$(az account show --query 'id' -o tsv)
              echo "##vso[task.setvariable variable=SUBSCRIPTIONID]$subscriptionId"
              echo "##vso[task.setvariable variable=RESOURCEGROUPNAME]$(resourceGroupName)"
              echo "##vso[task.setvariable variable=PRIVATECLOUDNAME]$(privateCloudName)"
              echo "##vso[task.setvariable variable=BASEDNGROUPS]$(baseDNGroups)"
              echo "##vso[task.setvariable variable=BASEDNUSERS]$(baseDNUsers)"
              echo "##vso[task.setvariable variable=PRIMARYURL]$(primaryURL)"
              echo "##vso[task.setvariable variable=SECONDARYURL]$(secondaryURL)"
              echo "##vso[task.setvariable variable=SECONDARYURL]$(secondaryURL)"
              echo "##vso[task.setvariable variable=DOMAINNETBIOSNAME]$(domainNetBIOSName)"
              echo "##vso[task.setvariable variable=DOMAINNAME]$(domainName)"
              echo "##vso[task.setvariable variable=LDAPUSERNAME]$(LDAPusername)"
              echo "##vso[task.setvariable variable=LDAPPASSWORD]$(LDAPpassword)"
              echo "##vso[task.setvariable variable=IDENTITYPACKAGEVERSION]$(identityPackageVersion)"

    # Verify private cloud health and SSH availability before running LDAPS tests.
    # The New-LDAPSIdentitySource cmdlet requires $SSH_Sessions (AVS runtime lazy dictionary)
    # to push SSL certificates to ESXi hosts. If the private cloud is unhealthy or SSH is
    # not available, the LDAPS test will fail with "null-valued expression" errors.
    - task: AzureCLI@2
      displayName: Verify Private Cloud Health
      inputs:
          azureSubscription: $(subscriptionName)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
              echo "=== Private Cloud Status ==="
              az vmware private-cloud show \
                  --resource-group $(resourceGroupName) \
                  --name $(privateCloudName) \
                  --query "{status:provisioningState, internet:properties.internet, endpoints:properties.endpoints}" \
                  -o json

              echo ""
              echo "=== Cluster Host Count ==="
              az vmware cluster list \
                  --resource-group $(resourceGroupName) \
                  --private-cloud $(privateCloudName) \
                  --query "[].{name:name, hosts:properties.hosts, status:properties.provisioningState}" \
                  -o json

              echo ""
              echo "=== Script Packages (Identity) ==="
              az vmware script-package list \
                  --resource-group $(resourceGroupName) \
                  --private-cloud $(privateCloudName) \
                  --query "[?contains(name, 'Identity')].{name:name, version:properties.version, company:properties.company}" \
                  -o json

    - task: AzureCLI@2
      displayName: Run Tests
      inputs:
          azureSubscription: $(subscriptionName)
          scriptType: bash
          scriptLocation: inlineScript
          addSpnToEnvironment: true
          inlineScript: |
              export AZURE_TENANT_ID=$servicePrincipalTenantId
              export AZURE_CLIENT_ID=$servicePrincipalId
              export AZURE_CLIENT_SECRET=$servicePrincipalKey
              dotnet test --logger trx

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      displayName: Publish Results
      inputs:
          testRunner: VSTest
          testResultsFiles: "**/*.trx"
          mergeTestResults: true
          testRunTitle: "AVS Management Tests"
          publishRunAttachments: true
